<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>双马尾小姑娘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
  /* Layout: full-screen WebGL stage, one floating note card top-left */
  :root {
    --sky: #dcecff;
    --ink: #3b3159;
    --ink-soft: #6a6290;
    --card: rgba(255, 255, 255, 0.8);
    --accent: #ff5a7e;
    --accent-ink: #ffffff;
    --font-display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--font-body); }
  #stage { position: fixed; inset: 0; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; cursor: default; }
  .hud {
    position: fixed;
    left: calc(16px + env(safe-area-inset-left, 0px));
    top: calc(16px + env(safe-area-inset-top, 0px));
    width: min(320px, calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
    box-sizing: border-box;
    background: var(--card);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 6px 24px rgba(59, 49, 89, 0.12);
    display: flex; flex-direction: column; gap: 8px;
  }
  .hud h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: 0.04em; text-wrap: balance; }
  .hud-head { display: flex; align-items: center; gap: 10px; }
  .hud-head h1 { flex: 1; min-width: 0; }
  .fps { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .toggle { background: transparent; color: var(--ink); padding: 2px 8px; font-size: 16px; line-height: 1; border-radius: 10px; transition: transform .15s; }
  .hud-body { display: flex; flex-direction: column; gap: 8px; }     /* desktop default: expanded */
  .hud.collapsed .hud-body { display: none; }
  .hud.expanded .hud-body { display: flex; }
  .hud.collapsed .toggle { transform: rotate(-90deg); }
  .hud p { margin: 0; font-size: 13px; line-height: 1.65; }
  .hud small { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; font-size: 13px; border: 0; border-radius: 999px; padding: 6px 14px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .slider { display: flex; align-items: center; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .slider input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .slider output { width: 3em; text-align: right; color: var(--ink-soft); }
  @media (max-width: 600px) {
    /* on phones the card sits at the bottom so it never covers the girl */
    .hud {
      left: 50%; right: auto; top: auto;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      width: min(440px, calc(100vw - 20px));
    }
    .hud p { font-size: 12px; }
    .hud h1 { font-size: 20px; }
    /* phones default to collapsed (title + fps only) unless the user expands it */
    .hud:not(.expanded) .hud-body { display: none; }
    .hud:not(.expanded) .toggle { transform: rotate(-90deg); }
  }
</style>

<div id="stage"><canvas id="c"></canvas></div>
<div class="hud" id="hud">
  <div class="hud-head">
    <h1>双马尾小姑娘</h1>
    <span id="fps" class="fps">– fps</span>
    <button id="toggle" class="toggle" type="button" aria-expanded="true" aria-label="展开或收起说明">▾</button>
  </div>
  <div class="hud-body" id="hudBody">
    <p>镜头已锁定。按住画面拖动：鼠标<b>向上</b>把小姑娘提起来（她会疯狂扑腾手脚、哇哇大哭），<b>向左 / 向右</b>让她朝对应方向旋转甩起来；松手她就会掉下来着地（咚）。下面可以显示骨骼、开关重力、调空气阻力。</p>
    <div class="row">
      <button id="reset" type="button">回到原位</button>
      <button id="bones" type="button" aria-pressed="false">显示骨骼</button>
      <button id="grav" type="button" aria-pressed="true">关闭重力</button>
    </div>
    <label class="slider" for="air">空气阻力 <input id="air" type="range" min="0" max="3" step="0.1" value="1"> <output id="airVal">1.0×</output></label>
    <small>弹簧阻尼跟随 · 辫子 2×20 根骨骼、裙摆 16×5 根骨骼，由 Verlet + FTL 链驱动，带空气阻力</small>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(() => {
  const V3 = THREE.Vector3;
  const canvas = document.getElementById('c');
  const isMobile = matchMedia('(max-width: 600px)').matches || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdcecff);
  scene.fog = new THREE.Fog(0xdcecff, 14, 34);

  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  camera.position.set(0, 2.0, 7.4);

  // ---------- materials ----------
  const gData = new Uint8Array([140,140,140,255, 205,205,205,255, 255,255,255,255]);
  const grad = new THREE.DataTexture(gData, 3, 1, THREE.RGBAFormat);
  grad.minFilter = grad.magFilter = THREE.NearestFilter;
  grad.generateMipmaps = false; grad.needsUpdate = true;
  const toon = (c, extra) => new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: grad }, extra || {}));
  const flat = (c, extra) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, extra || {}));

  const C = {
    skin: 0xffdccb, hair: 0x4b3a72, dress: 0xffc94d, collar: 0xffffff,
    ribbon: 0xff5a7e, shoe: 0xe8455d, sock: 0xffffff, eye: 0x33265e, mouth: 0xb8435a,
  };
  const M = {
    skin: toon(C.skin), hair: toon(C.hair, { side: THREE.DoubleSide }), dress: toon(C.dress),
    collar: toon(C.collar), ribbon: toon(C.ribbon), shoe: toon(C.shoe), sock: toon(C.sock),
    eye: flat(C.eye), white: flat(0xffffff), mouth: flat(C.mouth),
    blush: flat(0xff9bb0, { transparent: true, opacity: 0.55, depthWrite: false }),
  };

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfff, 0.42));
  const sun = new THREE.DirectionalLight(0xffffff, 0.62);
  sun.position.set(2.5, 5, 4); scene.add(sun);

  // ---------- ground ----------
  const ground = new THREE.Mesh(new THREE.CircleGeometry(11, 72), flat(0xe6def9));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const dotColors = [0xffb3c6, 0xffe08a, 0xa8e6cf, 0xb5c7ff, 0xffffff];
  for (let i = 0; i < 70; i++) {
    const r = 1.6 + rnd() * 8.5, a = rnd() * Math.PI * 2;
    const d = new THREE.Mesh(new THREE.CircleGeometry(0.05 + rnd() * 0.09, 16), flat(dotColors[i % dotColors.length]));
    d.rotation.x = -Math.PI / 2; d.position.set(Math.cos(a) * r, 0.005, Math.sin(a) * r); scene.add(d);
  }
  // blob shadow
  const sc = document.createElement('canvas'); sc.width = sc.height = 128;
  const sg = sc.getContext('2d'); const rg = sg.createRadialGradient(64, 64, 4, 64, 64, 64);
  rg.addColorStop(0, 'rgba(70,50,120,0.45)'); rg.addColorStop(1, 'rgba(70,50,120,0)');
  sg.fillStyle = rg; sg.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.01; scene.add(shadow);

  // ---------- the girl ----------
  const mesh = (geo, mat, parent, x = 0, y = 0, z = 0) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m;
  };
  const girl = new THREE.Group(); scene.add(girl);          // origin at feet
  const hip = new THREE.Group(); hip.position.y = 0.55; girl.add(hip);

  // legs
  const legs = [];
  for (const s of [-1, 1]) {
    const lp = new THREE.Group(); lp.position.set(s * 0.11, 0, 0); hip.add(lp);
    mesh(new THREE.CylinderGeometry(0.062, 0.058, 0.42, 14), M.skin, lp, 0, -0.21, 0);
    mesh(new THREE.CylinderGeometry(0.066, 0.064, 0.14, 14), M.sock, lp, 0, -0.39, 0);
    const shoe = mesh(new THREE.SphereGeometry(0.1, 18, 12), M.shoe, lp, 0, -0.48, 0.03);
    shoe.scale.set(0.9, 0.7, 1.35);
    legs.push({ g: lp, s, sp: { x: 0, v: 0 } });
  }
  // dress
  // (skirt is a SkinnedMesh, built with the physics chains below)
  mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.3, 24), M.dress, hip, 0, 0.39, 0);
  const collar = mesh(new THREE.TorusGeometry(0.15, 0.04, 10, 28), M.collar, hip, 0, 0.53, 0);
  collar.rotation.x = Math.PI / 2;
  mesh(new THREE.CylinderGeometry(0.052, 0.058, 0.16, 12), M.skin, hip, 0, 0.6, 0);
  // chest bow
  for (const s of [-1, 1]) {
    const b = mesh(new THREE.SphereGeometry(0.06, 12, 10), M.ribbon, hip, s * 0.06, 0.47, 0.17);
    b.scale.set(1.2, 0.8, 0.5); b.rotation.z = s * 0.3;
  }
  mesh(new THREE.SphereGeometry(0.03, 10, 8), M.ribbon, hip, 0, 0.47, 0.19);

  // arms
  const arms = [];
  for (const s of [-1, 1]) {
    const ap = new THREE.Group(); ap.position.set(s * 0.19, 0.5, 0); hip.add(ap);
    mesh(new THREE.SphereGeometry(0.085, 14, 10), M.dress, ap, 0, -0.02, 0);
    mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.36, 12), M.skin, ap, 0, -0.2, 0);
    mesh(new THREE.SphereGeometry(0.06, 12, 10), M.skin, ap, 0, -0.4, 0);
    arms.push({ g: ap, s, sp: { x: s * 0.22, v: 0 } });
  }

  // head
  const headPivot = new THREE.Group(); headPivot.position.y = 0.62; hip.add(headPivot);
  const head = new THREE.Group(); head.position.y = 0.52; headPivot.add(head);
  const face = mesh(new THREE.SphereGeometry(0.55, 40, 28), M.skin, head);
  face.scale.set(1, 0.95, 0.95);
  const cap = mesh(new THREE.SphereGeometry(0.6, 44, 24, 0, Math.PI * 2, 0, 1.78), M.hair, head);
  cap.rotation.x = -0.42;
  // back hair: back half-shell only, ends above the jaw line so nothing wraps the chin
  mesh(new THREE.SphereGeometry(0.6, 36, 24, Math.PI, Math.PI, 0, 2.05), M.hair, head, 0, -0.04, -0.02).scale.set(1.02, 1, 0.95);
  for (let i = -2; i <= 2; i++) {
    const x = i * 0.16, y = 0.2 - Math.abs(i) * 0.03;
    const z = Math.sqrt(Math.max(0.01, 0.36 - x * x - y * y)) - 0.03;
    const b = mesh(new THREE.SphereGeometry(0.15, 16, 12), M.hair, head, x, y, z);
    b.scale.set(0.95, 1.1, 0.45);
    b.rotation.set(-0.25, Math.asin(x / 0.6), -i * 0.12);
  }
  for (const s of [-1, 1]) {
    const lock = mesh(new THREE.SphereGeometry(0.14, 14, 12), M.hair, head, s * 0.5, -0.05, 0.15);
    lock.scale.set(0.5, 1.45, 0.55); lock.rotation.z = s * 0.12;
  }
  // eyes: normal open eyes + squeezed-shut ">< " cry eyes (tears are a particle system below)
  const eyes = [], cryEyes = [];
  for (const s of [-1, 1]) {
    const socket = new THREE.Group(); socket.position.set(s * 0.19, -0.07, 0.47); socket.rotation.y = s * 0.38;
    head.add(socket);
    const iris = new THREE.Group(); socket.add(iris);
    mesh(new THREE.SphereGeometry(0.085, 18, 14), M.eye, iris).scale.set(0.78, 1.05, 0.4);
    mesh(new THREE.SphereGeometry(0.027, 10, 8), M.white, iris, 0.022, 0.04, 0.028);
    mesh(new THREE.SphereGeometry(0.013, 8, 6), M.white, iris, -0.02, -0.035, 0.03);
    eyes.push(iris);
    // scrunched cry eye: two bars forming ">" (left) / "<" (right), vertex toward the nose
    const cryEye = new THREE.Group(); cryEye.position.z = 0.03; cryEye.visible = false; socket.add(cryEye);
    const vdir = -s, len = Math.hypot(0.11, 0.05);
    for (const ey of [0.05, -0.05]) {
      const bar = mesh(new THREE.BoxGeometry(len, 0.028, 0.02), M.eye, cryEye, 0, ey / 2, 0);
      bar.rotation.z = Math.atan2(ey, -vdir * 0.11);
    }
    cryEyes.push(cryEye);
  }
  for (const s of [-1, 1]) {
    const bl = mesh(new THREE.CircleGeometry(0.075, 20), M.blush, head, s * 0.32, -0.2, 0.395);
    bl.rotation.y = s * 0.62; bl.scale.y = 0.65;
  }
  const smile = mesh(new THREE.TorusGeometry(0.045, 0.011, 8, 20, Math.PI), M.mouth, head, 0, -0.22, 0.47);
  smile.rotation.z = Math.PI;
  const ohMouth = mesh(new THREE.SphereGeometry(0.045, 14, 10), M.mouth, head, 0, -0.245, 0.465);
  ohMouth.scale.set(0.85, 1.1, 0.35); ohMouth.visible = false;

  // ---------- twin tails: Verlet chain -> Bone chain -> SkinnedMesh ----------
  // The physics only moves particles; each frame the particles set bone rotations,
  // and the GPU deforms the skinned tube (same pipeline as an imported GLTF rig).
  const N = 20, SEG = 0.1, RINGS = isMobile ? 56 : 96, RAD = isMobile ? 8 : 12;
  let tailGravity = -14;
  const UP = new V3(0, 1, 0);
  const profile = t => (0.07 + 0.07 * Math.sin(Math.PI * Math.pow(t, 0.5))) * Math.pow(1 - t * t * t, 0.6) + 0.004;
  const tails = [];
  function makeTail(s) {
    const anchor = new V3(s * 0.38, 0.42, -0.06);
    const rest = [anchor.clone()];
    let p = anchor.clone();
    for (let i = 1; i < N; i++) {
      const a = Math.min(Math.PI * 0.97, 0.9 + (i - 1) * 0.4); // flare out at the tie, then hang
      p = p.clone().addScaledVector(new V3(s * Math.sin(a), Math.cos(a), -0.08).normalize(), SEG);
      rest.push(p);
    }
    // hair gather + tie + bow, fixed to head
    const dir0 = rest[1].clone().sub(rest[0]).normalize();
    mesh(new THREE.SphereGeometry(0.12, 16, 12), M.hair, head, anchor.x, anchor.y, anchor.z);
    const tie = mesh(new THREE.TorusGeometry(0.085, 0.035, 10, 24), M.ribbon, head);
    tie.position.copy(anchor).addScaledVector(dir0, 0.08);
    tie.quaternion.setFromUnitVectors(new V3(0, 0, 1), dir0);
    for (const k of [-1, 1]) {
      const loop = mesh(new THREE.SphereGeometry(0.075, 14, 10), M.ribbon, head);
      loop.position.copy(tie.position).add(new V3(0, 0.03, k * 0.1 + 0.02));
      loop.scale.set(0.45, 0.7, 1.15); loop.rotation.x = k * 0.5;
    }

    // bones in bind pose: each bone's local +Y runs along its segment, child sits SEG up the Y axis
    const bones = [], restLocalQ = [];
    let prevQ = new THREE.Quaternion(), prevDir = UP.clone();
    for (let i = 0; i < N; i++) {
      const b = new THREE.Bone(); b.name = (s < 0 ? 'tailL_' : 'tailR_') + i;
      const dir = i < N - 1 ? rest[i + 1].clone().sub(rest[i]).normalize() : prevDir.clone();
      const wq = new THREE.Quaternion().setFromUnitVectors(prevDir, dir).multiply(prevQ);
      const lq = prevQ.clone().invert().multiply(wq);
      if (i === 0) b.position.copy(rest[0]); else b.position.set(0, SEG, 0);
      b.quaternion.copy(lq);
      if (i) bones[i - 1].add(b);
      bones.push(b); restLocalQ.push(lq.clone());
      prevQ = wq; prevDir = dir;
    }

    // tapered tube in bind pose, with skin indices/weights blended across each joint
    const curve = new THREE.CatmullRomCurve3(rest.map(v => v.clone()));
    const nV = RINGS * RAD + 1;
    const pos = new Float32Array(nV * 3), sIdx = new Uint16Array(nV * 4), sW = new Float32Array(nV * 4);
    const setSkin = (v, f) => {
      const seg = Math.min(N - 2, Math.floor(f)), t = f - seg;
      let b, wa, wb;
      if (t < 0.5) { b = Math.max(0, seg - 1); wa = seg === 0 ? 1 : 0.5 + t; wb = 1 - wa; }
      else { b = seg + 1; wa = 1.5 - t; wb = t - 0.5; }
      sIdx[v * 4] = seg; sIdx[v * 4 + 1] = b; sW[v * 4] = wa; sW[v * 4 + 1] = wb;
    };
    const P = new V3(), T = new V3(), n = new V3(), bn = new V3();
    for (let j = 0; j < RINGS; j++) {
      const u = j / (RINGS - 1);
      curve.getPoint(u, P); curve.getTangent(u, T);
      if (j === 0) n.set(s, 0, 0);
      n.addScaledVector(T, -n.dot(T)).normalize();
      bn.crossVectors(T, n);
      const r = profile(u);
      for (let k = 0; k < RAD; k++) {
        const a = (k / RAD) * Math.PI * 2, ca = Math.cos(a) * r, sa = Math.sin(a) * r, v = j * RAD + k;
        pos[v * 3] = P.x + n.x * ca + bn.x * sa;
        pos[v * 3 + 1] = P.y + n.y * ca + bn.y * sa;
        pos[v * 3 + 2] = P.z + n.z * ca + bn.z * sa;
        setSkin(v, u * (N - 1));
      }
    }
    const tipV = RINGS * RAD;
    pos[tipV * 3] = P.x + T.x * 0.006; pos[tipV * 3 + 1] = P.y + T.y * 0.006; pos[tipV * 3 + 2] = P.z + T.z * 0.006;
    setSkin(tipV, N - 1);
    const idx = [];
    for (let j = 0; j < RINGS - 1; j++) for (let r = 0; r < RAD; r++) {
      const a = j * RAD + r, b = j * RAD + (r + 1) % RAD, c = a + RAD, d = b + RAD;
      idx.push(a, b, c, b, d, c);
    }
    for (let r = 0; r < RAD; r++) idx.push((RINGS - 1) * RAD + r, (RINGS - 1) * RAD + (r + 1) % RAD, tipV);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(sIdx, 4));
    geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sW, 4));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    geo.boundingSphere = new THREE.Sphere(new V3(), 3); // bind-pose bounds don't cover the swinging tail

    const m = new THREE.SkinnedMesh(geo, toon(C.hair, { skinning: true }));
    m.frustumCulled = false;
    head.add(m); m.add(bones[0]);
    girl.updateMatrixWorld(true);
    m.bind(new THREE.Skeleton(bones));

    const pts = [], prev = [];
    for (let i = 0; i < N; i++) { pts.push(new V3()); prev.push(new V3()); }
    // only the tie holds the hair; past it nothing but gravity, drag and contact shape the tail
    const stiff = rest.map((_, i) => i < 4 ? [0, 0.35, 0.16, 0.05][i] : 0);
    const radius = rest.map((_, i) => profile(i / (N - 1)));
    const vec = () => rest.map(() => new V3());
    tails.push({ s, rest, pts, prev, bones, restLocalQ, mesh: m, stiff, radius, old: vec(), d: vec(), hn: vec(), hit: rest.map(() => false) });
  }
  makeTail(-1); makeTail(1);

  const tmp = new V3(), tmp2 = new V3(), headC = new V3(), bodyC = new V3();
  function resetTails() {
    girl.updateMatrixWorld(true);
    for (const t of tails) for (let i = 0; i < N; i++) {
      t.pts[i].copy(t.rest[i]).applyMatrix4(head.matrixWorld); t.prev[i].copy(t.pts[i]);
    }
  }
  // Air drag on each hair node: linear + quadratic in speed (units/s). airScale is the UI slider.
  const AIR_LIN = 1.4, AIR_QUAD = 1.1, FTL_DAMP = 0.9;
  let airScale = 1;
  const nrmTmp = new V3();
  function stepTail(t, dt) {
    const mw = head.matrixWorld;
    headC.setFromMatrixPosition(mw);
    bodyC.set(0, 0.12, 0).applyMatrix4(hip.matrixWorld);
    const g = tailGravity * dt * dt;
    const P = t.pts, X = t.prev;
    P[0].copy(t.rest[0]).applyMatrix4(mw); X[0].copy(P[0]);

    // 1) integrate: inertia with air drag, gravity, faint pull toward the styled shape
    for (let i = 1; i < N; i++) {
      tmp.subVectors(P[i], X[i]);
      const speed = tmp.length() / dt;
      tmp.multiplyScalar(1 / (1 + (AIR_LIN + AIR_QUAD * speed) * airScale * dt));
      t.old[i].copy(P[i]);
      P[i].add(tmp); P[i].y += g;
      tmp2.copy(t.rest[i]).applyMatrix4(mw);

    o.connect(g); o.start(t); o.stop(t + 0.24);
    const len = Math.floor(ac.sampleRate * 0.05);
    const nb = ac.createBuffer(1, len, ac.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const ns = ac.createBufferSource(); ns.buffer = nb;
    const ng = ac.createGain(); ng.gain.value = vol * 0.6; ns.connect(ng); ng.connect(ac.destination); ns.start(t);
  }

  // ---------- mouse control: camera stays locked; press & drag to lift and spin ----------
  function setNdc(e) {
    const r = canvas.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  }
  function applyControl() {
    liftTarget = clamp(ndc.y, 0, 1) * MAX_LIFT;        // mouse up -> lift higher
    const nx = clamp(ndc.x, -1, 1);
    // steeper near centre so small drags already rotate; left -> turns her face left
    spinTargetVel = Math.sign(nx) * Math.pow(Math.abs(nx), 0.6) * SPIN_MAX;
    spinVel += (ndc.x - prevNdcX) * FLICK;              // flick impulse: drag distance -> extra spin
    prevNdcX = ndc.x;
  }
  canvas.addEventListener('pointerdown', e => {
    holding = true; audio();                           // the gesture unlocks WebAudio
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    setNdc(e); prevNdcX = ndc.x; applyControl();
    sp.sq.v += 1.2;
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    setNdc(e);
    if (holding) applyControl();
    else if (e.pointerType === 'mouse') canvas.style.cursor = 'grab';
  });
  const releaseCtl = () => { if (!holding) return; holding = false; liftTarget = 0; spinTargetVel = 0; canvas.style.cursor = 'default'; };
  canvas.addEventListener('pointerup', releaseCtl);
  canvas.addEventListener('pointercancel', releaseCtl);

  const skelHelper = new THREE.SkeletonHelper(girl);
  skelHelper.material.depthTest = false; skelHelper.material.transparent = true;
  skelHelper.renderOrder = 10; skelHelper.visible = false; scene.add(skelHelper);
  const boneBtn = document.getElementById('bones');
  boneBtn.addEventListener('click', () => {
    const on = !skelHelper.visible;
    skelHelper.visible = on;
    for (const mm of [...tails.map(t => t.mesh), skirt.mesh]) { mm.material.transparent = on; mm.material.opacity = on ? 0.45 : 1; mm.material.depthWrite = !on; }
    boneBtn.textContent = on ? '隐藏骨骼' : '显示骨骼';
    boneBtn.setAttribute('aria-pressed', String(on));
  });

  const gravBtn = document.getElementById('grav');
  gravBtn.addEventListener('click', () => {
    const on = tailGravity === 0;
    tailGravity = on ? -14 : 0;
    gravBtn.textContent = on ? '关闭重力' : '打开重力';
    gravBtn.setAttribute('aria-pressed', String(on));
  });

  const airIn = document.getElementById('air'), airOut = document.getElementById('airVal');
  airIn.addEventListener('input', () => { airScale = +airIn.value; airOut.textContent = airScale.toFixed(1) + '×'; });

  document.getElementById('reset').addEventListener('click', () => {
    S.pos.set(0, 0, 0); S.vel.set(0, 0, 0); S.last.set(0, 0, 0); S.acc.set(0, 0, 0);
    holding = false; liftTarget = 0; spinTargetVel = 0; spinVel = 0; spinAngle = 0;
    girl.rotation.y = 0; lifted = false; stopCry();
  });

  // collapsible HUD: phones start collapsed via CSS (title + fps stay visible); the button flips it
  const hud = document.getElementById('hud'), hudBody = document.getElementById('hudBody');
  const toggleBtn = document.getElementById('toggle'), fpsEl = document.getElementById('fps');
  const syncCaret = () => toggleBtn.setAttribute('aria-expanded', String(getComputedStyle(hudBody).display !== 'none'));
  toggleBtn.addEventListener('click', () => {
    const collapsed = getComputedStyle(hudBody).display === 'none';
    hud.classList.remove('collapsed', 'expanded');
    hud.classList.add(collapsed ? 'expanded' : 'collapsed');   // explicit choice overrides the CSS default
    syncCaret();
  });
  syncCaret();

  // ---------- loop ----------
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    const mob = w < 600;
    camera.aspect = w / h;
    camera.fov = mob ? 46 : 38;
    camera.position.set(0, mob ? 1.95 : 2.0, mob ? 6.0 : 7.4); // pull the camera in on phones
    camera.updateProjectionMatrix();
    camera.lookAt(0, mob ? 1.3 : 1.1, 0);                      // frame her above the bottom card
    syncCaret();
  }
  window.addEventListener('resize', resize); resize();

  girl.updateMatrixWorld(true); resetTails();
  for (const ch of skirt.chains) for (let j = 0; j < ch.pts.length; j++) { ch.pts[j].copy(ch.rest[j]).applyMatrix4(hip.matrixWorld); ch.prev[j].copy(ch.pts[j]); }
  const DT = isMobile ? 1 / 60 : 1 / 120, MAXSUB = isMobile ? 3 : 8; // fewer substeps on phones
  let acc = 0, last = performance.now();
  let fpsFrames = 0, fpsT0 = last;
  function frame(now) {
    const fdt = Math.min(0.05, (now - last) / 1000);
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    fpsFrames++;
    if (now - fpsT0 >= 500) { fpsEl.textContent = Math.round(fpsFrames * 1000 / (now - fpsT0)) + ' fps'; fpsFrames = 0; fpsT0 = now; }
    let nsub = 0;
    while (acc >= DT && nsub < MAXSUB) { step(DT); acc -= DT; nsub++; }
    if (acc > DT) acc = 0; // drop backlog instead of spiralling
    updateFace();
    updateTears(fdt, lifted);
    for (const t of tails) driveChain(t.mesh, t.bones, t.restLocalQ, t.pts);
    for (const ch of skirt.chains) driveChain(skirt.mesh, ch.bones, ch.restLocalQ, ch.pts);
    const h = S.pos.y;
    shadow.position.set(S.pos.x, 0.01, S.pos.z);
    const ss = 1 / (1 + h * 0.5); shadow.scale.set(ss, ss, ss);
    shadow.material.opacity = clamp(1 - h * 0.25, 0.25, 1);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
